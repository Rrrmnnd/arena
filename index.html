<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battle Arena</title>
<link rel="stylesheet" href="style.css?v=536">
</head>
<body>
<canvas id="game" width="720" height="1280"></canvas>
<div id="recIndicator" class="rec-indicator hidden">● REC</div>
<!-- Plain HTML, not canvas-drawn — sits on top of the game as a fixed corner panel so it works
     regardless of canvas scaling, and stays normal keyboard/mouse-accessible UI. See twitch.js.
     Starts hidden — press T (in OBS: right-click the source -> Interact, then T) to reveal it for
     setup/troubleshooting; it's not meant to be visible on the actual stream output. -->
<div id="twitchPanel" class="hidden">
  <button id="twitchLoginBtn" type="button">連接 Twitch</button>
  <div id="twitchStatus">尚未連接</div>
  <!-- One reward title per mode. Leaving the 1v1 box empty keeps its long-standing meaning of
       "fire a duel on ANY redemption"; filling it in makes all three exact matches. -->
  <label>1v1 獎勵名稱：<input id="twitchRewardInput" type="text" placeholder="例如：隨機對戰"></label>
  <button id="twitchTestBtn" type="button">🎲 測試 1v1</button>
  <label>大亂鬥獎勵名稱：<input id="twitchRewardInputRoyale" type="text" placeholder="例如：全員大亂鬥"></label>
  <button id="twitchTestBtnRoyale" type="button">🎲 測試大亂鬥</button>
  <label>車輪戰獎勵名稱：<input id="twitchRewardInputGauntlet" type="text" placeholder="例如：車輪戰"></label>
  <button id="twitchTestBtnGauntlet" type="button">🎲 測試車輪戰</button>
  <button id="twitchResumeBtn" type="button" class="hidden">▶ 恢復待機</button>
  <!-- OBS's built-in browser (an older Chromium build) frequently can't handle Twitch's own
       login/consent page — the Authorize button ends up stuck greyed-out. Workaround: log in on
       this SAME page but in a normal browser (Chrome/Edge) instead, then copy the token it shows
       you there and paste it in here — the OBS source itself never has to touch Twitch's login
       page at all. -->
  <div id="twitchCopyRow" class="hidden">
    <label>權杖（複製到 OBS）：<input id="twitchCopyTokenInput" type="text" readonly></label>
    <button id="twitchCopyTokenBtn" type="button">📋 複製</button>
  </div>
  <label>或貼上權杖：<input id="twitchPasteTokenInput" type="text" placeholder="在此貼上權杖"></label>
  <button id="twitchPasteTokenBtn" type="button">🔑 使用貼上的權杖</button>
</div>
<!-- ?v= is bumped by hand whenever any script below changes, so the browser can't serve a
     stale-cached file alongside fresh ones (a mix of old/new files across these tightly
     coupled scripts throws at runtime instead of just looking outdated). -->
<script src="arena.js?v=536"></script>
<script src="character.js?v=536"></script>
<script src="sfx.js?v=536"></script>
